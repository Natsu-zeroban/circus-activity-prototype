<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>马戏团原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell" aria-label="版本活动地图形式验证原型">
    <header class="topbar">
      <div class="brand-lockup">
        <button class="icon-button" id="backButton" type="button" aria-label="返回验证起点">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
        </button>
        <div>
          <p class="eyebrow" id="dayEyebrow">第1日 · 潮湿序幕</p>
          <h1>马戏团原型</h1>
        </div>
      </div>

      <div class="progress-card" aria-live="polite">
        <span class="progress-label" id="progressLabel">三日调查进度</span>
        <strong id="progressText">0 / 13</strong>
        <span class="progress-track"><i id="progressBar"></i></span>
      </div>

      <nav class="top-actions" aria-label="原型功能">
        <button class="text-button roster-button" id="informantButton" type="button">线人档案 <span id="informantCount">0 / 9</span></button>
        <button class="text-button focus-button" id="focusButton" type="button">定位当前节点</button>
        <button class="text-button danger" id="resetButton" type="button">重置验证</button>
      </nav>
    </header>

    <section class="map-viewport" id="viewport" aria-label="可拖动的活动长条地图">
      <div class="map-world" id="world">
        <div class="map-art" id="mapArt" role="img" aria-label="第1日抽象剧场街区背景"></div>
        <div class="vignette" aria-hidden="true"></div>

        <div class="chapter-label chapter-a" id="chapterLabel"><span>第1日</span> 潮湿序幕</div>

        <svg class="route-layer" id="routeLayer" viewBox="0 0 3840 1280" aria-hidden="true"></svg>
        <div class="node-layer" id="nodeLayer"></div>

        <div class="player-token" id="playerToken" aria-label="局长棋子">
          <span class="token-shadow"></span>
          <span class="token-body">
            <svg viewBox="0 0 48 54" aria-hidden="true">
              <path d="M15 10h18l5 9-4 5v17l-10 8-10-8V24l-4-5z"/>
              <path d="m18 13 6-7 6 7M17 28h14M20 34h8"/>
            </svg>
          </span>
          <span class="token-label">局长</span>
        </div>
      </div>

      <aside class="legend-card" aria-label="节点图例">
        <h2>节点图例</h2>
        <div><i class="legend-node main"></i><span>主线</span></div>
        <div><i class="legend-node side">S</i><span>支线</span></div>
        <div><i class="legend-node info"></i><span>信息</span></div>
        <div><i class="legend-node play"></i><span>玩法信息流</span></div>
      </aside>

      <aside class="validation-note">
        <span class="validation-tag" id="gateTitle">第1日调查中</span>
        <p id="gateText">沿当前主线继续调查。</p>
      </aside>

      <div class="drag-hint" id="dragHint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11V7a2 2 0 0 1 4 0v3-5a2 2 0 0 1 4 0v5-3a2 2 0 0 1 4 0v7c0 5-3 8-8 8h-1c-3 0-5-1-7-4l-2-3a2 2 0 0 1 3-2z"/></svg>
        拖动地图查看已探索区域
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <section class="story-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalBody">
        <button class="modal-close" id="modalClose" type="button" aria-label="关闭弹窗">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
        <div class="modal-kicker" id="modalKicker">主线调查</div>
        <h2 id="modalTitle">节点名称</h2>
        <div class="modal-rule"><span></span></div>
        <p id="modalBody">节点介绍</p>
        <p class="modal-note" id="modalNote"></p>
        <div class="modal-actions">
          <button class="secondary-button" id="cancelButton" type="button">返回</button>
          <button class="primary-button" id="confirmButton" type="button">前往</button>
        </div>
      </section>
    </div>

    <div class="panel-backdrop" id="rosterBackdrop" hidden>
      <aside class="roster-panel" role="dialog" aria-modal="true" aria-labelledby="rosterTitle">
        <header class="roster-header">
          <div>
            <p class="eyebrow">MBCC临时情报网络</p>
            <h2 id="rosterTitle">线人档案</h2>
          </div>
          <button class="modal-close light" id="rosterClose" type="button" aria-label="关闭线人档案">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </header>
        <p class="roster-summary" id="rosterSummary">线人随本日调查加入；完整档案由指定剧情节点解锁。</p>
        <div class="roster-list" id="rosterList"></div>
      </aside>
    </div>

    <div class="modal-backdrop dispatch-backdrop" id="dispatchBackdrop" hidden>
      <section class="dispatch-modal" role="dialog" aria-modal="true" aria-labelledby="dispatchTitle">
        <button class="modal-close light" id="dispatchClose" type="button" aria-label="关闭派遣玩法">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
        <div class="dispatch-heading">
          <div>
            <p class="dispatch-kicker">必经信息流 · 线人派遣</p>
            <h2 id="dispatchTitle">特殊场景调查</h2>
          </div>
          <span class="attempt-tag">仅可挑战 1 次</span>
        </div>
        <div class="task-brief">
          <span id="dispatchIndex">委托 I-3</span>
          <figure class="event-visual">
            <img id="dispatchImage" alt="" />
            <figcaption>现场影像 · 请结合画面与记录判断</figcaption>
          </figure>
          <p id="dispatchQuestion"></p>
          <strong id="dispatchRule"></strong>
          <div class="scene-records">
            <span>现场记录</span>
            <ul id="dispatchClues"></ul>
          </div>
        </div>
        <div class="dispatch-options" id="dispatchOptions" aria-label="选择派遣线人"></div>
        <p class="selection-hint" id="selectionHint" aria-live="polite"></p>
        <section class="dispatch-result" id="dispatchResult" hidden aria-live="polite">
          <span class="result-mark" id="resultMark" aria-hidden="true"></span>
          <div>
            <h3 id="resultTitle"></h3>
            <p id="resultBody"></p>
            <p class="outcome-impact" id="outcomeImpact"></p>
          </div>
        </section>
        <div class="dispatch-actions">
          <button class="secondary-button" id="dispatchCancel" type="button">返回地图</button>
          <button class="primary-button" id="dispatchSubmit" type="button" disabled>确认派遣</button>
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
